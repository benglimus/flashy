<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Korean TTS</title>
</head>
<body>

  <input type="text" id="koreanText" value="안녕하세요! 반갑습니다." placeholder="Enter Korean text">
  <button onclick="speakKorean()">Speak Korean</button>

  <script>
    function speakKorean() {
      const text = document.getElementById('koreanText').value;
      if (!text) return;

      // 1. Create a speech utterance
      const utterance = new SpeechSynthesisUtterance(text);

      // 2. Set language to Korean
      utterance.lang = 'ko-KR';

      // 3. Optional adjustments
      utterance.rate = 0.9; // Slightly slower for language learners (0.1 to 10)
      utterance.pitch = 1.0; // Voice pitch (0 to 2)

      // 4. Speak
      window.speechSynthesis.speak(utterance);
    }
  </script>

</body>
</html>
